[General]
# Absolute path to a background image. Leave blank to use the gradient fallback.
Background=/usr/share/sddm/themes/liquidglass/s1.jpg

# Base font
FontFamily=Noto Sans
FontSize=11

# Glass card tint (any Qt color string). Kept subtle on purpose — the blur does the work.
GlassTint=#ffffff
GlassOpacity=0.10

# Accent color used for the Login button and focus rings
AccentColor=#7aa2f7

# Corner radius of the glass card, in px
CornerRadius=28

# Clock format, Qt date/time format string
ClockFormat=hh:mm

# Show the session picker dropdown
ShowSessionPicker=true
